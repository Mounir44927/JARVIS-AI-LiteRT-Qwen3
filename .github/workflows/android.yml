name: Android

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Make Gradle executable
        run: chmod +x gradlew scripts/*.sh

      - name: Build JARVIS Rive asset
        run: ./scripts/build_jarvis_rive.sh

      - name: Prepare Sherpa-ONNX static TTS runtime
        run: ./scripts/setup_sherpa_tts.sh

      - name: Verify build configuration
        run: ./scripts/verify_build_configuration.sh
      - name: Verify ONNX Runtime configuration
        run: ./scripts/verify_onnx_runtime_configuration.sh
      - name: Verify source configuration
        run: ./scripts/verify_source_configuration.sh


      - name: Prepare JARVIS Piper voice
        run: ./scripts/setup_jarvis_voice.sh

      - name: Prepare OpenWakeWord model
        run: ./scripts/setup_wakeword.sh

      - name: Prepare pinned whisper.cpp native STT source
        run: ./scripts/setup_whisper.sh

      - name: Verify offline voice assets
        run: ./scripts/verify_voice_assets.sh

      - name: Verify local JARVIS Rive asset
        run: test -s app/src/main/res/raw/jarvis_orb.riv

      - name: Verify Koog agent integration
        run: ./scripts/verify_koog_configuration.sh

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Android Lint
        run: ./gradlew lintDebug --stacktrace

      - name: Assemble Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
